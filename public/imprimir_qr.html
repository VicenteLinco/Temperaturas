<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Impresión de Códigos QR - Control Térmico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        @media print {
            @page {
                size: A4;
                margin: 10mm;
            }

            body {
                margin: 0;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            .page-break {
                page-break-after: always;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f7;
            color: #1d1d1f;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .controls {
            background: #1d1d1f;
            padding: 16px 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid #f2f2f2;
        }
        .controls h2 {
            margin: 0;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .controls h2 i {
            color: #f2f2f2;
        }
        .controls .btn-group-custom {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: #ffffff;
            color: #1d1d1f;
            border: 1px solid transparent;
        }
        .btn-primary:hover {
            background-color: #e2e2e5;
        }

        .btn-secondary {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #4d4d4f;
        }
        .btn-secondary:hover {
            background-color: #2b2b2d;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .qr-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 1px 3px rgba(20,20,22,0.08);
            border: 1px solid #e2e2e5;
            break-inside: avoid;
        }

        .qr-item h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #1d1d1f;
            font-weight: 600;
        }

        .qr-item .qr-container {
            margin: 15px auto;
            display: inline-block;
        }

        .qr-container img,
        .qr-container canvas {
            max-width: 100%;
            height: auto;
        }

        .qr-item .info {
            font-size: 12px;
            color: #6e6e73;
            margin-top: 10px;
            line-height: 1.6;
        }

        @media print {
            .qr-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .qr-item {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .controls {
                padding: 14px;
                justify-content: center;
                text-align: center;
            }
            .controls h2 {
                justify-content: center;
                font-size: 1.05rem;
            }
            .controls .btn-group-custom {
                width: 100%;
                justify-content: center;
            }
            .controls .btn {
                flex: 1 1 40%;
                justify-content: center;
            }
            .qr-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }
            .qr-item {
                padding: 12px;
            }
            .qr-item h3 {
                font-size: 14px;
            }
        }
    </style>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <div class="controls no-print">
            <h2><i class="bi bi-qr-code"></i> Imprimir Códigos QR</h2>
            <div class="btn-group-custom">
                <button class="btn btn-primary" onclick="window.print()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn btn-secondary" onclick="window.close()">
                    <i class="bi bi-x-circle"></i> Cerrar
                </button>
            </div>
        </div>

        <div id="qr-grid" class="qr-grid"></div>
    </div>

    <script>
        // Obtener datos (Primero intentar localStorage, luego URL params)
        let termometrosData = null;
        
        try {
            const localData = localStorage.getItem('temp_print_data');
            if (localData) {
                termometrosData = localData;
                // Limpiar después de usar (opcional, pero buena práctica)
                // localStorage.removeItem('temp_print_data'); 
            }
        } catch (e) { console.error('Error accediendo a localStorage', e); }

        if (!termometrosData) {
            const urlParams = new URLSearchParams(window.location.search);
            const urlData = urlParams.get('data');
            if (urlData) termometrosData = decodeURIComponent(urlData);
        }

        if (termometrosData) {
            try {
                const termometros = JSON.parse(termometrosData);
                renderQRCodes(termometros);
            } catch (error) {
                console.error('Error parsing data:', error);
                document.getElementById('qr-grid').innerHTML = '<p>Error al cargar los datos</p>';
            }
        } else {
            document.getElementById('qr-grid').innerHTML = '<p>No hay datos para mostrar</p>';
        }

        function renderQRCodes(termometros) {
            const grid = document.getElementById('qr-grid');
            grid.innerHTML = '';

            termometros.forEach((termometro, index) => {
                const item = document.createElement('div');
                item.className = 'qr-item';

                // Nombre del termómetro
                const title = document.createElement('h3');
                title.textContent = termometro.nombre;
                item.appendChild(title);

                // Contenedor del QR
                const qrContainer = document.createElement('div');
                qrContainer.className = 'qr-container';
                qrContainer.id = `qr-${termometro.id}`;
                item.appendChild(qrContainer);

                // Información adicional
                const info = document.createElement('div');
                info.className = 'info';
                info.innerHTML = `
                    ID: ${termometro.id}<br>
                    Área: ${termometro.area_nombre || 'N/A'}<br>
                    Tipo: ${termometro.tipo_nombre || 'N/A'}
                `;
                item.appendChild(info);

                grid.appendChild(item);

                // Generar QR code (Solo ID numérico para lectura rápida y robusta)
                new QRCode(qrContainer, {
                    text: termometro.id.toString(),
                    width: 200,
                    height: 200,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            });
        }
    </script>
</body>
</html>
