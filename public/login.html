<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Temperaturas - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #e53935 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .thermo-icon {
            font-size: 3.5rem;
            color: #4364F7;
            margin-bottom: 1rem;
        }
        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .btn-login {
            padding: 0.8rem;
            font-weight: 600;
            border-radius: 10px;
            background: #4364F7;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: #0052D4;
            transform: translateY(-2px);
        }
        .input-group-text {
            background: transparent;
            border-right: none;
            color: #666;
        }
        .form-control {
            border-left: none;
            padding: 0.8rem;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #ced4da;
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            backdrop-filter: blur(5px);
        }
        .loader-container {
            width: 300px;
            text-align: center;
        }
        .progress {
            height: 10px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .progress-bar {
            background: linear-gradient(90deg, #4364F7, #e53935);
            transition: width 0.1s linear;
        }
        .loader-text {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .percentage-text {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loader-container">
            <div class="percentage-text" id="percentageText">0%</div>
            <div class="progress">
                <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
            <div class="loader-text">Iniciando sesión...</div>
            <div class="small text-muted">Por favor, espere un momento</div>
        </div>
    </div>

    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-thermometer-half thermo-icon"></i>
            <h1>Control de Temperatura</h1>
            <p class="text-muted">Inicie sesión para continuar</p>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Usuario" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                </div>
            </div>
            <div id="errorMessage" class="alert alert-danger d-none py-2 small"></div>
            <button type="submit" class="btn btn-primary btn-login w-100">
                Entrar <i class="bi bi-arrow-right-short"></i>
            </button>
        </form>
    </div>

    <script>
        // Verificar si ya hay una sesión activa para redirigir automáticamente
        async function checkSession() {
            try {
                const response = await fetch('/api/me');
                if (response.ok) {
                    const data = await response.json();
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect');
                    window.location.replace(redirectUrl ? decodeURIComponent(redirectUrl) : 
                                         (data.rol === 'ADMINISTRADOR' ? '/admin.html' : '/index.html'));
                }
            } catch (err) {
                console.error('Error verificando sesión:', err);
            }
        }
        checkSession();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const overlay = document.getElementById('loadingOverlay');
            const progressBar = document.getElementById('progressBar');
            const percentageText = document.getElementById('percentageText');

            // Reset error
            errorDiv.classList.add('d-none');

            // Show loading overlay
            overlay.style.display = 'flex';
            
            let currentProgress = 0;
            let stopAnimation = false;

            // Animación orgánica: Avanza rápido al principio y luego más lento
            const runAnimation = async () => {
                while (!stopAnimation && currentProgress < 98) {
                    // Cuanto más cerca del 100, más pequeños son los pasos
                    let step = (100 - currentProgress) / 25;
                    currentProgress += Math.max(step, 0.1); 
                    
                    progressBar.style.width = `${currentProgress}%`;
                    percentageText.textContent = `${Math.floor(currentProgress)}%`;
                    
                    // Velocidad variable para que parezca "pensando"
                    await new Promise(r => setTimeout(r, 50 + Math.random() * 50));
                }
            };

            try {
                // Iniciar la animación en segundo plano
                runAnimation();

                // Realizar la petición al servidor
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (data.success) {
                    // Al tener éxito, completamos al 100% rápido
                    stopAnimation = true;
                    progressBar.style.width = '100%';
                    percentageText.textContent = '100%';
                    
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect');
                        // Usamos replace para que no se pueda volver atrás al login
                        window.location.replace(redirectUrl ? decodeURIComponent(redirectUrl) : 
                                             (data.user.rol === 'ADMINISTRADOR' ? '/admin.html' : '/index.html'));
                    }, 300);
                } else {
                    stopAnimation = true;
                    overlay.style.display = 'none';
                    errorDiv.textContent = data.message || 'Credenciales incorrectas';
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                stopAnimation = true;
                overlay.style.display = 'none';
                errorDiv.textContent = 'Error de conexión';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
