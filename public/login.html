<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control Térmico - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --brand: #2563eb;
            --brand-dark: #1d4ed8;
            --bg-dark: #0f172a;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * {
            box-sizing: border-box;
        }
        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }
        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--brand);
            animation: fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .thermo-badge {
            width: 64px;
            height: 64px;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        .thermo-icon {
            font-size: 2.2rem;
            color: var(--brand);
        }
        .login-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.4rem;
            letter-spacing: -0.02em;
        }
        .login-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0;
            line-height: 1.4;
        }
        .btn-login {
            padding: 0.85rem;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            background-color: var(--brand);
            border: 1px solid var(--brand-dark);
            color: #ffffff;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-login:hover {
            background-color: var(--brand-dark);
            border-color: var(--brand-dark);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .input-group {
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-group:focus-within {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .input-group-text {
            background-color: #f8fafc;
            border: none;
            border-right: 1px solid var(--border-color);
            color: #64748b;
            font-size: 1.05rem;
            padding-left: 0.9rem;
            padding-right: 0.9rem;
        }
        .form-control {
            border: none;
            padding: 0.8rem 0.9rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-dark);
        }
        .form-control:focus {
            box-shadow: none;
            background-color: #ffffff;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.4rem;
        }
        .alert {
            border-radius: 8px;
            font-size: 0.875rem;
        }
        .login-footer-text {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid #f1f5f9;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 1.75rem 1.25rem;
                border-radius: 12px;
            }
            .login-header h1 {
                font-size: 1.4rem;
            }
            .thermo-badge {
                width: 54px;
                height: 54px;
            }
            .thermo-icon {
                font-size: 1.8rem;
            }
        }

        /* Loading Overlay plano y sobrio */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #ffffff;
        }
        .loader-container {
            width: 320px;
            max-width: calc(100vw - 48px);
            text-align: center;
            background: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .progress {
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .progress-bar {
            background-color: var(--brand);
            transition: width 0.1s linear;
        }
        .loader-text {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 0.25rem;
        }
        .percentage-text {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.75rem;
            font-feature-settings: "tnum";
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loader-container">
            <div class="percentage-text" id="percentageText">0%</div>
            <div class="progress">
                <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
            <div class="loader-text">Autenticando usuario...</div>
            <div class="small text-slate-400" style="color: #94a3b8;">Por favor, espere un momento</div>
        </div>
    </div>

    <div class="login-card">
        <div class="login-header">
            <div class="thermo-badge">
                <i class="bi bi-thermometer-half thermo-icon"></i>
            </div>
            <h1>Control de Temperatura</h1>
            <p>Plataforma de Monitoreo y Registro de Equipos Térmicos</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Ingrese su usuario" required autofocus autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required autocomplete="current-password">
                </div>
            </div>
            <div id="errorMessage" class="alert alert-danger d-none py-2 px-3 mb-3"></div>
            <button type="submit" class="btn btn-login w-100">
                <span>Ingresar al Sistema</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>
        <div class="login-footer-text">
            <i class="bi bi-shield-check me-1"></i> Acceso Seguro &bull; Control de Calidad Térmica
        </div>
    </div>

    <script>
        // Verificar si ya hay una sesión activa para redirigir automáticamente
        async function checkSession() {
            try {
                const response = await fetch('/api/me');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.rol) { // ✅ Solo redirigir si hay datos de usuario válidos
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect');
                        window.location.replace(redirectUrl ? decodeURIComponent(redirectUrl) : 
                                             (data.rol === 'ADMINISTRADOR' ? '/admin.html' : '/index.html'));
                    }
                }
            } catch (err) {
                console.error('Error verificando sesión:', err);
            }
        }
        checkSession();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const overlay = document.getElementById('loadingOverlay');
            const progressBar = document.getElementById('progressBar');
            const percentageText = document.getElementById('percentageText');

            // Reset error
            errorDiv.classList.add('d-none');

            // Show loading overlay
            overlay.style.display = 'flex';
            
            let currentProgress = 0;
            let stopAnimation = false;

            // Animación orgánica: Avanza rápido al principio y luego más lento
            const runAnimation = async () => {
                while (!stopAnimation && currentProgress < 98) {
                    // Cuanto más cerca del 100, más pequeños son los pasos
                    let step = (100 - currentProgress) / 25;
                    currentProgress += Math.max(step, 0.1); 
                    
                    progressBar.style.width = `${currentProgress}%`;
                    percentageText.textContent = `${Math.floor(currentProgress)}%`;
                    
                    // Velocidad variable para que parezca "pensando"
                    await new Promise(r => setTimeout(r, 50 + Math.random() * 50));
                }
            };

            try {
                // Iniciar la animación en segundo plano
                runAnimation();

                // Realizar la petición al servidor
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (data.success) {
                    // Al tener éxito, completamos al 100% rápido
                    stopAnimation = true;
                    progressBar.style.width = '100%';
                    percentageText.textContent = '100%';
                    
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect');
                        // Usamos replace para que no se pueda volver atrás al login
                        window.location.replace(redirectUrl ? decodeURIComponent(redirectUrl) : 
                                             (data.user.rol === 'ADMINISTRADOR' ? '/admin.html' : '/index.html'));
                    }, 300);
                } else {
                    stopAnimation = true;
                    overlay.style.display = 'none';
                    errorDiv.textContent = data.message || 'Credenciales incorrectas';
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                stopAnimation = true;
                overlay.style.display = 'none';
                errorDiv.textContent = 'Error de conexión';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
