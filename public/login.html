<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control Térmico - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="lecturas.css">
    <style>
        /* overflow-x en html además de body: sin él, el fondo ambiental de 800px
           ensancha el viewport de layout en móvil (390px reales → 595px de layout)
           y todo lo posicionado a pantalla completa deja de verse centrado. */
        html {
            overflow-x: clip;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            position: relative;
            background-color: var(--apple-bg);
        }

        .top-bar-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .login-card {
            position: relative;
            z-index: 1;
            padding: 2.25rem;
            border-radius: var(--apple-radius-lg);
            width: 100%;
            max-width: 420px;
            background: var(--apple-card-bg);
            border: 1px solid var(--apple-card-border);
            box-shadow: var(--apple-shadow-md);
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .thermo-badge {
            width: 64px;
            height: 64px;
            background: var(--apple-blue-soft);
            border: 1px solid var(--apple-border);
            border-radius: var(--apple-radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        .thermo-icon {
            font-size: 2.2rem;
            color: var(--apple-blue);
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }

        .login-header p {
            font-size: 0.88rem;
            color: var(--apple-text-secondary);
            margin-bottom: 0;
            line-height: 1.4;
        }

        .btn-login {
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--apple-radius-sm);
            background: var(--apple-blue);
            border: none;
            color: #ffffff;
            transition: background-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-login:hover {
            background: var(--apple-blue-hover);
            color: #ffffff;
        }

        .input-group-text {
            background-color: var(--apple-gray-light);
            border-color: var(--apple-border);
            color: var(--apple-text-secondary);
        }

        .toggle-password {
            cursor: pointer;
            transition: color 0.15s ease;
        }
        .toggle-password:hover {
            color: var(--apple-blue);
        }

        .role-hint-box {
            background: var(--apple-gray-light);
            border: 1px solid var(--apple-border);
            border-radius: var(--apple-radius-sm);
            padding: 0.85rem;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--apple-text-secondary);
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            height: 100%;
            height: 100dvh;
            background-color: rgba(10, 10, 12, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #ffffff;
        }

        .loader-container {
            width: 320px;
            max-width: calc(100vw - 48px);
            text-align: center;
            background: var(--apple-card-bg);
            padding: 2rem;
            border-radius: var(--apple-radius-lg);
            border: 1px solid var(--apple-border);
            box-shadow: var(--apple-shadow-lg);
        }

        .progress {
            height: 6px;
            background-color: var(--apple-gray);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar {
            background: var(--apple-blue);
            transition: width 0.1s linear;
        }

        .percentage-text {
            font-size: 2rem;
            font-weight: 800;
            color: var(--apple-text);
            margin-bottom: 0.75rem;
            font-feature-settings: "tnum";
        }
    </style>
</head>
<body>
    <div class="top-bar-controls">
        <button type="button" class="btn btn-outline-secondary btn-sm rounded-circle p-2" id="btnThemeToggle" onclick="toggleTheme()" title="Cambiar Tema (Oscuro/Claro)">
            <i class="bi bi-moon-stars-fill" id="themeToggleIcon"></i>
        </button>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loader-container">
            <div class="percentage-text" id="percentageText">0%</div>
            <div class="progress">
                <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
            <div class="fw-bold mb-1" style="color: var(--apple-text)">Autenticando usuario...</div>
            <div class="small text-muted">Verificando credenciales y perfil</div>
        </div>
    </div>

    <div class="login-card">
        <div class="login-header">
            <div class="thermo-badge">
                <i class="bi bi-thermometer-half thermo-icon"></i>
            </div>
            <h1>Control Térmico</h1>
            <p>Sistema de Gestión, Monitoreo y Registro de Temperaturas</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small">Nombre de Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Ingrese su usuario" required autofocus autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold small">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required autocomplete="current-password">
                    <span class="input-group-text toggle-password" onclick="togglePasswordVisibility()"><i class="bi bi-eye" id="eyeIcon"></i></span>
                </div>
            </div>
            <div id="errorMessage" class="alert alert-danger d-none py-2 px-3 mb-3 small rounded-3"></div>
            <button type="submit" class="btn btn-login w-100">
                <span>Ingresar al Sistema</span>
                <i class="bi bi-arrow-right-short fs-5"></i>
            </button>
        </form>

        <div class="role-hint-box">
            <div class="d-flex align-items-center gap-2 mb-1 fw-semibold text-body">
                <i class="bi bi-info-circle-fill text-primary"></i> Módulos Disponibles
            </div>
            <div class="d-flex justify-content-between text-muted align-items-center">
                <span><i class="bi bi-qr-code-scan me-1"></i> Registrador</span>
                <span><i class="bi bi-speedometer2 me-1"></i> Administrador</span>
            </div>
        </div>

        <div class="text-center mt-3 pt-2 border-top text-muted small" style="font-size: 0.78rem;">
            <i class="bi bi-shield-check me-1 text-success"></i> Conexión Segura &bull; Control de Calidad
        </div>
    </div>

    <script src="lecturas.js"></script>
    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        async function checkSession() {
            try {
                const response = await fetch('/api/me');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.rol) {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect');
                        window.location.replace(redirectUrl ? decodeURIComponent(redirectUrl) : 
                                             (data.rol === 'ADMINISTRADOR' ? '/admin.html' : '/index.html'));
                    }
                }
            } catch (err) {
                console.error('Error verificando sesión:', err);
            }
        }
        checkSession();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const overlay = document.getElementById('loadingOverlay');
            const progressBar = document.getElementById('progressBar');
            const percentageText = document.getElementById('percentageText');

            errorDiv.classList.add('d-none');
            overlay.style.display = 'flex';
            
            let currentProgress = 0;
            let stopAnimation = false;

            const runAnimation = async () => {
                while (!stopAnimation && currentProgress < 98) {
                    let step = (100 - currentProgress) / 25;
                    currentProgress += Math.max(step, 0.1); 
                    progressBar.style.width = `${currentProgress}%`;
                    percentageText.textContent = `${Math.floor(currentProgress)}%`;
                    await new Promise(r => setTimeout(r, 50 + Math.random() * 50));
                }
            };

            try {
                runAnimation();

                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();

                if (data.success) {
                    stopAnimation = true;
                    progressBar.style.width = '100%';
                    percentageText.textContent = '100%';
                    
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect');
                        window.location.replace(redirectUrl ? decodeURIComponent(redirectUrl) : 
                                             (data.user.rol === 'ADMINISTRADOR' ? '/admin.html' : '/index.html'));
                    }, 300);
                } else {
                    stopAnimation = true;
                    overlay.style.display = 'none';
                    errorDiv.textContent = data.message || 'Credenciales incorrectas';
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                stopAnimation = true;
                overlay.style.display = 'none';
                errorDiv.textContent = 'Error de conexión con el servidor';
                errorDiv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
