<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Temperaturas - Registrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .main-container {
            display: flex;
            height: calc(100vh - 56px);
            margin-top: 56px;
        }
        .scanner-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #fff;
        }
        .sidebar-panel {
            width: 350px;
            background-color: #f8f9fa;
            border-left: 1px solid #dee2e6;
            overflow-y: auto;
            padding: 20px;
        }
        #qr-reader {
            width: 100%;
            max-width: 500px;
            border: 3px solid #667eea;
            border-radius: 15px;
            overflow: hidden;
        }
        .scanner-status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1em;
        }
        .area-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .area-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        .termometro-mini {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 5px;
            font-size: 0.9em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .termometro-pendiente {
            background-color: #fff3cd;
            border-left: 3px solid #ffc107;
        }
        .termometro-completado {
            background-color: #d4edda;
            border-left: 3px solid #28a745;
        }
        .stats-badge {
            font-size: 0.85em;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark fixed-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-qr-code-scan"></i> Scanner de Temperaturas
            </span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="bi bi-person-circle"></i> <span id="username"></span>
                </span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- Sección del Scanner -->
        <div class="scanner-section">
            <div class="text-center mb-4">
                <h2><i class="bi bi-upc-scan"></i> Escanear Código QR</h2>
                <p class="text-muted">Acerca el código QR del termómetro a la cámara</p>
            </div>

            <div id="qr-reader"></div>

            <div id="scannerStatus" class="scanner-status d-none"></div>

            <div class="mt-4 text-center">
                <p class="text-muted">
                    <i class="bi bi-info-circle"></i>
                    Los datos se registrarán automáticamente al escanear
                </p>
            </div>
        </div>

        <!-- Panel Lateral -->
        <div class="sidebar-panel">
            <div class="mb-3">
                <h5><i class="bi bi-building"></i> Estado por Áreas</h5>
                <p class="text-muted small">Ventana: <strong id="ventanaActual">-</strong></p>
            </div>

            <div id="areasContainer">
                <div class="text-center text-muted py-5">
                    <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                    <p class="mt-2">Cargando áreas...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Registro -->
    <div class="modal fade" id="registroModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar Temperatura</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registroForm">
                        <input type="hidden" id="termometroId">

                        <div class="mb-3">
                            <label class="form-label"><strong>Termómetro:</strong></label>
                            <p id="termometroNombre" class="mb-0"></p>
                        </div>

                        <div class="mb-3">
                            <label for="tempMaxima" class="form-label">Temperatura Máxima (°C)</label>
                            <input type="number" step="0.1" class="form-control" id="tempMaxima" required>
                        </div>

                        <div class="mb-3">
                            <label for="tempMinima" class="form-label">Temperatura Mínima (°C)</label>
                            <input type="number" step="0.1" class="form-control" id="tempMinima" required>
                        </div>

                        <div class="mb-3" id="humedadGroup" style="display: none;">
                            <label for="humedad" class="form-label">Humedad (%)</label>
                            <input type="number" step="0.1" class="form-control" id="humedad">
                        </div>

                        <div class="mb-3">
                            <label for="observaciones" class="form-label">Observaciones (opcional)</label>
                            <textarea class="form-control" id="observaciones" rows="3"></textarea>
                        </div>

                        <div id="advertencias" class="alert alert-warning" style="display: none;"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarRegistro()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        let currentUser = null;
        let html5QrCode = null;
        let areasData = {};
        let termometroSeleccionado = null;

        // Verificar autenticación al cargar
        async function checkAuth() {
            try {
                const response = await fetch('/api/me');
                if (!response.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                currentUser = await response.json();
                document.getElementById('username').textContent = currentUser.username;

                await inicializarApp();
            } catch (error) {
                window.location.href = '/login.html';
            }
        }

        async function inicializarApp() {
            await cargarTodasLasAreas();
            inicializarScanner();
        }

        function inicializarScanner() {
            html5QrCode = new Html5Qrcode("qr-reader");

            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanError
            ).catch(err => {
                console.error('Error al iniciar scanner:', err);
                mostrarEstado('Error al iniciar la cámara. Por favor, permite el acceso.', 'danger');
            });
        }

        async function onScanSuccess(decodedText, decodedResult) {
            const termometroId = parseInt(decodedText);

            if (isNaN(termometroId)) {
                mostrarEstado('QR no válido', 'warning');
                return;
            }

            // Pausar el scanner mientras procesamos
            html5QrCode.pause();

            try {
                await procesarTermometro(termometroId);
            } catch (error) {
                console.error('Error:', error);
                mostrarEstado('Error al procesar termómetro', 'danger');
                setTimeout(() => html5QrCode.resume(), 2000);
            }
        }

        function onScanError(errorMessage) {
            // Ignorar errores de escaneo continuos
        }

        async function procesarTermometro(termometroId) {
            try {
                const response = await fetch(`/api/termometros/${termometroId}`);
                if (!response.ok) {
                    throw new Error('Termómetro no encontrado');
                }

                const termometro = await response.json();

                mostrarEstado(`✓ ${termometro.nombre || 'ID: ' + termometro.id} - ${termometro.area_nombre}`, 'success');

                // Resaltar el área en el panel
                resaltarArea(termometro.area_id);

                // Abrir modal de registro
                await abrirModalRegistro(termometro);

            } catch (error) {
                mostrarEstado('Termómetro no encontrado', 'danger');
                setTimeout(() => html5QrCode.resume(), 2000);
            }
        }

        async function cargarTodasLasAreas() {
            try {
                const response = await fetch('/api/areas');
                const areas = await response.json();

                for (const area of areas) {
                    if (!area.activa) continue;

                    try {
                        const pendientesResponse = await fetch(`/api/areas/${area.id}/pendientes`);
                        const pendientesData = await pendientesResponse.json();

                        areasData[area.id] = {
                            area: area,
                            ventana: pendientesData.ventana_horaria,
                            pendientes: pendientesData.pendientes || [],
                            completados: pendientesData.completados || []
                        };
                    } catch (error) {
                        console.error(`Error al cargar datos del área ${area.id}:`, error);
                    }
                }

                renderizarAreas();
            } catch (error) {
                console.error('Error al cargar áreas:', error);
            }
        }

        function renderizarAreas() {
            const container = document.getElementById('areasContainer');
            const ventana = Object.values(areasData)[0]?.ventana || '-';
            document.getElementById('ventanaActual').textContent = ventana;

            if (Object.keys(areasData).length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-3">No hay áreas disponibles</div>';
                return;
            }

            container.innerHTML = '';

            for (const [areaId, data] of Object.entries(areasData)) {
                const totalPendientes = data.pendientes.length;
                const totalCompletados = data.completados.length;
                const total = totalPendientes + totalCompletados;

                const areaCard = document.createElement('div');
                areaCard.className = 'area-card';
                areaCard.id = `area-${areaId}`;

                areaCard.innerHTML = `
                    <div class="area-header">
                        <strong>${data.area.nombre}</strong>
                        <div>
                            <span class="badge bg-success stats-badge">${totalCompletados}</span>
                            <span class="badge bg-warning stats-badge">${totalPendientes}</span>
                        </div>
                    </div>
                    <div class="termometros-list">
                        ${data.pendientes.map(t => `
                            <div class="termometro-mini termometro-pendiente">
                                <span>${t.nombre || 'ID: ' + t.id}</span>
                                <i class="bi bi-hourglass-split"></i>
                            </div>
                        `).join('')}
                        ${data.completados.map(r => `
                            <div class="termometro-mini termometro-completado">
                                <span>${r.termometro_nombre || 'ID: ' + r.termometro_id}</span>
                                <i class="bi bi-check-circle"></i>
                            </div>
                        `).join('')}
                    </div>
                `;

                container.appendChild(areaCard);
            }
        }

        function resaltarArea(areaId) {
            // Quitar resaltado anterior
            document.querySelectorAll('.area-card').forEach(card => {
                card.style.border = 'none';
            });

            // Resaltar área actual
            const areaCard = document.getElementById(`area-${areaId}`);
            if (areaCard) {
                areaCard.style.border = '3px solid #667eea';
                areaCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        async function abrirModalRegistro(termometro) {
            termometroSeleccionado = termometro;

            document.getElementById('termometroId').value = termometro.id;
            document.getElementById('termometroNombre').textContent =
                `${termometro.nombre || 'ID: ' + termometro.id} - ${termometro.tipo_nombre}`;

            // Mostrar/ocultar campo de humedad
            const humedadGroup = document.getElementById('humedadGroup');
            if (termometro.tiene_humedad) {
                humedadGroup.style.display = 'block';
                document.getElementById('humedad').required = true;
            } else {
                humedadGroup.style.display = 'none';
                document.getElementById('humedad').required = false;
            }

            // Limpiar formulario
            document.getElementById('registroForm').reset();
            document.getElementById('advertencias').style.display = 'none';

            const modal = new bootstrap.Modal(document.getElementById('registroModal'));
            modal.show();
        }

        async function guardarRegistro() {
            const termometroId = document.getElementById('termometroId').value;
            const tempMaxima = parseFloat(document.getElementById('tempMaxima').value);
            const tempMinima = parseFloat(document.getElementById('tempMinima').value);
            const humedad = document.getElementById('humedad').value ?
                parseFloat(document.getElementById('humedad').value) : null;
            const observaciones = document.getElementById('observaciones').value || null;

            try {
                const response = await fetch('/api/registros', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        termometro_id: parseInt(termometroId),
                        temp_maxima: tempMaxima,
                        temp_minima: tempMinima,
                        humedad: humedad,
                        observaciones: observaciones
                    })
                });

                if (response.ok) {
                    mostrarEstado('✓ Registro guardado exitosamente', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('registroModal')).hide();

                    // Recargar datos de las áreas
                    await cargarTodasLasAreas();

                    // Resumir scanner después de 1 segundo
                    setTimeout(() => {
                        if (html5QrCode) {
                            html5QrCode.resume();
                        }
                    }, 1000);
                } else {
                    const error = await response.text();
                    alert('Error al guardar: ' + error);
                    html5QrCode.resume();
                }
            } catch (error) {
                alert('Error de conexión: ' + error.message);
                html5QrCode.resume();
            }
        }

        function mostrarEstado(mensaje, tipo) {
            const status = document.getElementById('scannerStatus');
            status.className = `scanner-status alert alert-${tipo}`;
            status.textContent = mensaje;
            status.classList.remove('d-none');

            setTimeout(() => {
                status.classList.add('d-none');
            }, 3000);
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login.html';
            } catch (error) {
                window.location.href = '/login.html';
            }
        }

        // Inicializar
        checkAuth();
    </script>
</body>
</html>
